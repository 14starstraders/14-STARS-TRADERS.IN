<style>
:root{--gold:#d4af37;--dark:#1a1a1a;--light-bg:#f8f9fa}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Montserrat',sans-serif}
body{background:#fff;color:#333;line-height:1.5;overflow-x:hidden}

header{background:var(--dark);color:#fff;padding:12px 0;position:sticky;top:0;z-index:1000;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.nav-container{max-width:1200px;margin:auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:20px;font-weight:700;color:#fff;text-decoration:none;cursor:pointer}

.hero-banner{
width:100%;
height:450px;
background:#222 url('/images/hero.webp') center/cover no-repeat;
position:relative
}
.hero-banner::after{
content:'';
position:absolute;
inset:0;
background:rgba(0,0,0,.25)
}

.container{max-width:1200px;margin:auto;padding:0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:25px;padding:20px 0}

.product-card{
background:#fff;
border:1px solid #eee;
border-radius:12px;
padding:15px;
transition:.3s;
display:flex;
flex-direction:column;
will-change:transform
}
.product-card:hover{transform:translateY(-8px);box-shadow:0 12px 25px rgba(0,0,0,.08)}

.img-container{background:var(--light-bg);height:220px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;overflow:hidden}
.img-container img{max-width:85%;max-height:85%;object-fit:contain}

.p-name{font-size:15px;font-weight:600;margin-bottom:8px;height:42px;overflow:hidden}
.p-price{font-size:18px;font-weight:700;margin-bottom:15px}

.qty-box{display:flex;border:1px solid #ddd;border-radius:8px;overflow:hidden;margin-top:auto}
.qty-box button{flex:1;height:40px;border:none;background:#f9f9f9;cursor:pointer}
.qty-box input{width:50px;text-align:center;border:none;font-weight:700}

@media(max-width:768px){
.grid{grid-template-columns:repeat(2,1fr);gap:15px}
.hero-banner{height:300px}
}
</style>
</head>

<body>

<header>
<div class="nav-container">
<a class="logo" onclick="app.nav('home')">14 STARS TRADERS</a>
</div>
</header>

<main>
<section id="page-home">
<div class="hero-banner" role="img" aria-label="Premium gadgets and home products banner"></div>
<div class="container">
<div id="homeGrid" class="grid"></div>
</div>
</section>
</main>

<script defer>
const app={
products:[
{id:1,category:"Gadgets",name:"4 In 1 EMERGENCY LIGHT",price:200,img:"https://m.media-amazon.com/images/I/511FKiYjv3L._SX342_SY445_QL70_FMwebp_.jpg",desc:"Ultra-bright portable emergency light with 4 modes."},
{id:2,category:"Gadgets",name:"BUDDHA TRIMMER",price:250,img:"https://m.media-amazon.com/images/I/51aY9Kw1Y6L._SY300_SX300_QL70_FMwebp_.jpg",desc:"Professional metal body hair trimmer."}
],
cart:[],

init(){this.render()},

nav(id){},

render(){
const target=document.getElementById('homeGrid')
target.innerHTML=this.products.map(p=>`
<div class="product-card">
<div class="img-container">
<img src="${p.img}" alt="${p.name} - Buy Online at 14 Stars Traders" loading="lazy" width="200" height="200">
</div>
<div class="p-name">${p.name}</div>
<div class="p-price">Rs. ${p.price}.00</div>
<div class="qty-box">
<button onclick="app.updateQty(${p.id},-1)">−</button>
<input type="number" value="0" readonly>
<button onclick="app.updateQty(${p.id},1)">+</button>
</div>
</div>
`).join('')
},

updateQty(id,delta){}
}

app.init()
</script>

</body>
