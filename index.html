<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>14 STARS TRADERS | Premium Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #d4af37; --dark: #1a1a1a; --wa-green: #25d366; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: #fff; color: #333; overflow-x: hidden; }

        /* Header & Navigation */
        header { background: var(--dark); color: #fff; padding: 15px 0; position: sticky; top: 0; z-index: 1000; }
        .nav-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 15px; }
        .logo { font-size: 22px; font-weight: 700; color: #fff; text-decoration: none; background: none; border: none; cursor: pointer; }
        
        /* Search Box */
        .header-search { flex-grow: 1; max-width: 400px; position: relative; }
        .header-search input { width: 100%; padding: 10px 15px; border-radius: 20px; border: none; outline: none; background: rgba(255,255,255,0.15); color: #fff; }
        .smart-results { position: absolute; top: 110%; left: 0; width: 100%; background: white; border-radius: 8px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); display: none; z-index: 2000; }
        .search-item { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; color: #333; }
        .search-item img { width: 40px; height: 40px; margin-right: 10px; border-radius: 5px; }

        /* Product Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .card { border: 1px solid #eee; border-radius: 15px; padding: 15px; transition: 0.3s; position: relative; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .img-box { height: 200px; display: flex; align-items: center; justify-content: center; background: #f9f9f9; border-radius: 10px; overflow: hidden; margin-bottom: 10px; cursor: pointer; }
        .img-box img { max-width: 80%; transition: 0.3s; }

        /* Zoom Feature */
        .zoom-box { position: relative; overflow: hidden; cursor: zoom-in; border-radius: 15px; background: #f9f9f9; }
        .zoom-box img { width: 100%; transition: transform 0.2s ease; }

        /* Modals */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: #fff; padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; position: relative; }

        /* Social Proof Popup */
        #social-proof { position: fixed; bottom: 20px; left: 20px; background: white; padding: 10px 15px; border-radius: 12px; box-shadow: 0 5px 25px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 12px; z-index: 5000; transform: translateY(200%); transition: 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #social-proof.show { transform: translateY(0); }

        .btn-buy { background: #000; color: #fff; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .badge { background: var(--gold); color: #fff; padding: 2px 7px; border-radius: 50%; font-size: 12px; margin-left: 5px; }

        @media (max-width: 600px) { .grid { grid-template-columns: 1fr 1fr; } .nav-links { display: none; } }
    </style>
</head>
<body>

    <div id="payModal" class="modal">
        <div class="modal-content">
            <h3>Complete Payment</h3>
            <p style="margin: 10px 0;">Amount: <b>Rs. <span id="payAmt"></span></b></p>
            <img id="qrImg" src="" style="width: 200px; height: 200px; margin: 15px 0;">
            <button class="btn-buy" onclick="showForm()">I HAVE PAID (Fill Details)</button>
            <p onclick="closeModals()" style="margin-top:15px; cursor:pointer; font-size:12px; color:red;">Cancel</p>
        </div>
    </div>

    <div id="formModal" class="modal">
        <div class="modal-content" style="text-align: left;">
            <h3 style="text-align:center">Delivery Info</h3>
            <div style="background:#fff3cd; padding:8px; font-size:11px; margin:10px 0;">📍 Only for Muzaffarnagar City</div>
            <input type="text" id="name" placeholder="Full Name" style="width:100%; padding:10px; margin:5px 0;">
            <input type="tel" id="phone" placeholder="WhatsApp Number" style="width:100%; padding:10px; margin:5px 0;">
            <textarea id="addr" placeholder="Address in Muzaffarnagar" style="width:100%; padding:10px; margin:5px 0; height:70px;"></textarea>
            <button class="btn-buy" style="background:var(--wa-green)" onclick="finishOrder()">PLACE ORDER ON WHATSAPP</button>
        </div>
    </div>

    <header>
        <div class="nav-container">
            <button class="logo" onclick="location.reload()">14 STARS</button>
            <div class="header-search">
                <input type="text" id="searchInput" placeholder="Search gadgets..." oninput="searchProduct(this.value)">
                <div id="searchRes" class="smart-results"></div>
            </div>
            <div onclick="showCart()" style="cursor:pointer; color:white;">👜<span id="cartBadge" class="badge">0</span></div>
        </div>
    </header>

    <div id="homePage">
        <div style="height: 300px; background: #222 url('https://source.unsplash.com/1600x900/?gadget,luxury') center/cover; display:flex; align-items:center; justify-content:center; color:white; flex-direction:column;">
            <h1 style="font-size:3rem; text-shadow: 2px 2px 10px #000;">14 STARS</h1>
            <p>Premium Quality & Service</p>
        </div>
        <div id="productGrid" class="grid"></div>
    </div>

    <div id="detailPage" style="display:none; padding:40px 20px; max-width:1000px; margin:0 auto;"></div>

    <div id="cartPage" style="display:none; padding:40px 20px; max-width:600px; margin:0 auto;">
        <h2>Your Shopping Bag</h2>
        <div id="cartList" style="margin:20px 0;"></div>
        <div id="cartTotal" style="border-top:2px solid #000; padding:20px 0; text-align:right;"></div>
    </div>

    <div id="social-proof">
        <img src="" id="sp-img" width="40" height="40" style="border-radius:50%">
        <div style="font-size:11px;"><span id="sp-user" style="font-weight:700"></span> just bought <br><span id="sp-item"></span></div>
    </div>

    <script>
        const products = [
            { id: 1, name: "4 In 1 EMERGENCY LIGHT", price: 200, img: "https://m.media-amazon.com/images/I/511FKiYjv3L._SX342_SY445_QL70_FMwebp_.jpg", desc: "Super bright LED with multi-modes." },
            { id: 2, name: "BUDDHA TRIMMER", price: 250, img: "https://m.media-amazon.com/images/I/51aY9Kw1Y6L._SY300_SX300_QL70_FMwebp_.jpg", desc: "Professional carving and trimming." },
            { id: 3, name: "4 In 1 FACIAL KIT", price: 250, img: "https://m.media-amazon.com/images/I/71xiDo3LSbL._SX679_.jpg", desc: "Instant glow facial kit." },
            { id: 4, name: "VACCUM SEALER", price: 250, img: "https://m.media-amazon.com/images/I/71fD76VAK-L._SX569_.jpg", desc: "Keep your food fresh longer." }
        ];

        let cart = JSON.parse(localStorage.getItem('stars_cart')) || [];

        function renderProducts() {
            document.getElementById('productGrid').innerHTML = products.map(p => `
                <div class="card">
                    <div class="img-box" onclick="viewProduct(${p.id})"><img src="${p.img}"></div>
                    <div style="font-weight:700; height:40px;">${p.name}</div>
                    <div style="color:var(--gold); font-weight:700; margin:10px 0;">Rs. ${p.price}</div>
                    <button class="btn-buy" onclick="addToCart(${p.id})">ADD TO CART</button>
                </div>
            `).join('');
            updateUI();
        }

        function viewProduct(id) {
            const p = products.find(x => x.id === id);
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('cartPage').style.display = 'none';
            const dp = document.getElementById('detailPage');
            dp.style.display = 'block';
            dp.innerHTML = `
                <button onclick="location.reload()" style="margin-bottom:20px; border:none; background:none; cursor:pointer;">← Back</button>
                <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap:40px;">
                    <div class="zoom-box" onmousemove="zoom(event)" onmouseleave="zoomOut(event)">
                        <img src="${p.img}" id="zoomImg">
                    </div>
                    <div>
                        <h1>${p.name}</h1>
                        <h2 style="color:var(--gold); margin:15px 0;">Rs. ${p.price}</h2>
                        <p style="color:#666; margin-bottom:20px;">${p.desc}</p>
                        <button class="btn-buy" style="padding:18px" onclick="addToCart(${p.id})">ADD TO CART</button>
                    </div>
                </div>
            `;
        }

        function zoom(e) {
            const img = document.getElementById('zoomImg');
            img.style.transformOrigin = `${e.offsetX}px ${e.offsetY}px`;
            img.style.transform = "scale(2)";
        }
        function zoomOut() { document.getElementById('zoomImg').style.transform = "scale(1)"; }

        function addToCart(id) {
            const item = products.find(p => p.id === id);
            const exists = cart.find(c => c.id === id);
            if(exists) exists.q++; else cart.push({...item, q: 1});
            updateUI();
            alert("Added to cart!");
        }

        function updateUI() {
            localStorage.setItem('stars_cart', JSON.stringify(cart));
            document.getElementById('cartBadge').innerText = cart.reduce((s, i) => s + i.q, 0);
        }

        function showCart() {
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('detailPage').style.display = 'none';
            document.getElementById('cartPage').style.display = 'block';
            const list = document.getElementById('cartList');
            if(cart.length === 0) { list.innerHTML = "Cart is empty."; return; }
            let total = 0;
            list.innerHTML = cart.map(i => {
                total += i.price * i.q;
                return `<div style="display:flex; justify-content:space-between; margin-bottom:15px; align-items:center;">
                    <img src="${i.img}" width="50">
                    <div style="flex:1; margin-left:15px;"><b>${i.name}</b><br>Rs. ${i.price} x ${i.q}</div>
                    <button onclick="changeQ(${i.id}, -1)">-</button>
                    <button onclick="changeQ(${i.id}, 1)">+</button>
                </div>`;
            }).join('');
            document.getElementById('cartTotal').innerHTML = `<h3>Total: Rs. ${total}</h3><button class="btn-buy" onclick="checkout(${total})">PROCEED TO PAY</button>`;
        }

        function changeQ(id, d) {
            const i = cart.find(x => x.id === id);
            i.q += d;
            if(i.q <= 0) cart = cart.filter(x => x.id !== id);
            showCart();
            updateUI();
        }

        function checkout(amt) {
            document.getElementById('payAmt').innerText = amt;
            document.getElementById('qrImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=9837904369@ptsbi%26pn=14STARS%26am=${amt}%26cu=INR`;
            document.getElementById('payModal').style.display = 'flex';
        }

        function showForm() {
            document.getElementById('payModal').style.display = 'none';
            document.getElementById('formModal').style.display = 'flex';
        }

        function finishOrder() {
            const name = document.getElementById('name').value;
            const items = cart.map(i => `${i.name} (x${i.q})`).join(', ');
            const msg = `New Order!\nName: ${name}\nItems: ${items}\nTotal: Rs. ${document.getElementById('payAmt').innerText}\nAddress: ${document.getElementById('addr').value}`;
            window.open(`https://wa.me/919837904369?text=${encodeURIComponent(msg)}`);
        }

        function searchProduct(val) {
            const res = document.getElementById('searchRes');
            if(!val) { res.style.display = 'none'; return; }
            const match = products.filter(p => p.name.toLowerCase().includes(val.toLowerCase()));
            res.innerHTML = match.map(p => `<div class="search-item" onclick="viewProduct(${p.id})"><img src="${p.img}">${p.name}</div>`).join('');
            res.style.display = match.length ? 'block' : 'none';
        }

        function closeModals() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }

        // Social Proof Logic
        setInterval(() => {
            const names = ["Sameer", "Arun", "Zaid", "Rohan", "Priya"];
            const p = products[Math.floor(Math.random()*products.length)];
            document.getElementById('sp-user').innerText = names[Math.floor(Math.random()*names.length)];
            document.getElementById('sp-item').innerText = p.name;
            document.getElementById('sp-img').src = p.img;
            const sp = document.getElementById('social-proof');
            sp.classList.add('show');
            setTimeout(() => sp.classList.remove('show'), 4000);
        }, 10000);

        renderProducts();
    </script>
</body>
</html>
