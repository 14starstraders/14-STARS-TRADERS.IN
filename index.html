<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>14 STARS TRADERS | Official Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #d4af37; --dark: #1a1a1a; --light-bg: #f8f9fa; --wa-green: #25d366; --beige: #bcaaa4; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: #ffffff; color: #333; line-height: 1.5; overflow-x: hidden; }

        /* HEADER & SEARCH IN NAV */
        header { background: var(--dark); color: #fff; padding: 15px 0; position: sticky; top: 0; z-index: 1000; }
        .nav-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
        
        .logo { font-size: 20px; font-weight: 700; color: #fff; border: none; background: none; cursor: pointer; white-space: nowrap; }
        
        .header-search { flex-grow: 1; max-width: 500px; position: relative; z-index: 1001; }
        .header-search input { width: 100%; padding: 10px 40px 10px 20px; border-radius: 25px; border: none; outline: none; font-size: 14px; background: rgba(255,255,255,0.1); color: white; transition: 0.3s; }
        .header-search input:focus { background: white; color: #000; }
        
        .header-search .search-icon { 
            position: absolute; 
            right: 15px; 
            top: 50%; 
            transform: translateY(-50%); 
            color: #888; 
            cursor: pointer; 
            pointer-events: auto; 
            z-index: 10;
        }

        .header-actions { display: flex; align-items: center; gap: 20px; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: #fff; text-decoration: none; font-size: 13px; cursor: pointer; opacity: 0.8; }

        .cart-btn { position: relative; cursor: pointer; background: none; border: none; color: white; font-size: 22px; }
        .badge { position: absolute; top: -8px; right: -8px; background: var(--gold); color: #fff; font-size: 10px; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        #searchOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); z-index: 999; }

        .hero-banner { width: 100%; height: 500px; background: linear-gradient(rgba(0,0,0,0.4),rgba(0,0,0,0.4)), url('https://copilot.microsoft.com/th/id/BCO.c36814e0-4b79-4fd5-9e55-1000825f2caa.png') center/cover; display: flex; align-items: center; justify-content: center; color: white; text-align: center; }
        .filter-section { display: flex; gap: 10px; overflow-x: auto; padding: 25px 0; justify-content: center; scrollbar-width: none; }
        .filter-btn { padding: 8px 20px; border: 1px solid #eee; border-radius: 20px; background: #fff; cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.3s; }
        .filter-btn.active { background: var(--dark); color: white; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; padding: 20px 0; }
        .product-card { background: #fff; border: 1px solid #f0f0f0; border-radius: 12px; padding: 12px; }
        .img-container { background: var(--light-bg); height: 200px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: zoom-in; }
        .img-container img { max-width: 80%; }
        .p-name { font-size: 14px; font-weight: 600; margin: 10px 0; height: 40px; }
        .p-price { font-size: 16px; font-weight: 700; color: #000; margin-bottom: 10px; }
        
        .qty-box { display: flex; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; width: fit-content; }
        .qty-box button { width: 35px; height: 35px; border: none; background: #fff; cursor: pointer; font-size: 18px; }
        .qty-box input { width: 40px; text-align: center; border: none; outline: none; font-weight: bold; -moz-appearance: textfield; }
        .qty-box input::-webkit-outer-spin-button, .qty-box input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        .product-detail-container { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; padding: 40px 0; align-items: start; }
        .detail-img-box { background: var(--light-bg); border-radius: 15px; padding: 20px; display: flex; justify-content: center; }
        .detail-img-box img { max-width: 100%; border-radius: 10px; }
        .detail-info { padding: 20px; }
        .detail-info h1 { font-size: 32px; margin-bottom: 10px; }
        .detail-info .price-tag { font-size: 24px; font-weight: bold; color: #333; margin-bottom: 20px; }
        .detail-info .desc { color: #666; font-size: 15px; margin-bottom: 30px; line-height: 1.8; }
        .buy-now-btn { background: #bcaaa4; color: white; border: none; padding: 15px 40px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 200px; }

        /* CART PAGE STYLES */
        .cart-header-row { display: grid; grid-template-columns: 2fr 1fr 1fr; padding: 20px 0; border-bottom: 1px solid #eee; color: #888; font-size: 12px; letter-spacing: 1px; }
        .cart-item { display: grid; grid-template-columns: 2fr 1fr 1fr; align-items: center; padding: 25px 0; border-bottom: 1px solid #eee; }
        .cart-product-cell { display: flex; align-items: center; gap: 20px; }
        .cart-product-cell img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; background: var(--light-bg); }
        .cart-item-info b { font-size: 16px; display: block; margin-bottom: 5px; }
        .cart-item-info span { color: #666; font-size: 14px; }
        .delete-btn { background: none; border: none; cursor: pointer; margin-left: 15px; color: #333; font-size: 18px; }
        .total-cell { text-align: right; font-weight: 600; font-size: 16px; }
        .quantity-cell { display: flex; align-items: center; }

        .page-view { display: none; }
        .active { display: block; }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            .header-search { max-width: 180px; }
            .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .product-detail-container { grid-template-columns: 1fr; }
            .cart-header-row { display: none; }
            .cart-item { grid-template-columns: 1fr; gap: 15px; }
            .total-cell { text-align: left; }
        }
    </style>
</head>
<body>

    <div id="searchOverlay" onclick="app.hideSearch()"></div>

    <header>
        <div class="nav-container">
            <button class="logo" onclick="app.nav('home')">14 STARS TRADERS</button>
            <div class="header-search">
                <input type="text" id="navSearch" placeholder="Search products..." onfocus="app.showSearch()" onkeyup="if(event.key === 'Enter') app.performSearch(this.value)">
                <span class="search-icon" onclick="app.performSearch(document.getElementById('navSearch').value)">🔍</span>
            </div>
            <div class="header-actions">
                <nav class="nav-links">
                    <a onclick="app.nav('home')">Home</a>
                    <a onclick="app.nav('catalog')">Catalog</a>
                    <a onclick="app.nav('contact')">Contact</a>
                </nav>
                <button class="cart-btn" onclick="app.nav('cart')">
                    👜 <span class="badge" id="badge">0</span>
                </button>
            </div>
        </div>
    </header>

    <main>
        <section id="page-home" class="page-view active">
            <div class="hero-banner">
                <h1></h1>
            </div>
            <div class="container">
                <div class="filter-section">
                    <button class="filter-btn active" onclick="app.filter('All', this)">All Items</button>
                    <button class="filter-btn" onclick="app.filter('Gadgets', this)">Gadgets</button>
                    <button class="filter-btn" onclick="app.filter('Beauty', this)">Beauty</button>
                    <button class="filter-btn" onclick="app.filter('Home', this)">Home</button>
                </div>
                <div id="homeGrid" class="grid"></div>
            </div>
        </section>

        <section id="page-product-detail" class="page-view">
            <div class="container">
                <div id="productDetailContent" class="product-detail-container"></div>
            </div>
        </section>

        <section id="page-search" class="page-view">
            <div class="container">
                <h2 style="text-align:center; margin-top:40px;">Search Results</h2>
                <div id="searchGrid" class="grid"></div>
            </div>
        </section>

        <section id="page-catalog" class="page-view">
            <div class="container">
                <h2 style="margin: 40px 0; text-align:center;">Product Catalog</h2>
                <div id="catalogGrid" class="grid"></div>
            </div>
        </section>

        <section id="page-contact" class="page-view">
            <div class="container" style="max-width:800px; padding:60px 20px;">
                <h2>Get in touch</h2>
                <p>Contact us at: muzaffarnagar.store@example.com</p>
            </div>
        </section>

        <section id="page-cart" class="page-view">
            <div class="container" style="max-width: 900px; padding: 50px 20px;">
                <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 30px;">
                    <h1 style="font-size: 40px; font-weight: 500;">Your cart</h1>
                    <a onclick="app.nav('home')" style="text-decoration: underline; cursor: pointer; font-size: 14px; color: #666;">Continue shopping</a>
                </div>
                
                <div class="cart-header-row">
                    <span>PRODUCT</span>
                    <span>QUANTITY</span>
                    <span style="text-align: right;">TOTAL</span>
                </div>

                <div id="cartItemsList"></div>

                <div id="cartSummary" style="text-align:right; margin-top:40px; border-top: 1px solid #eee; padding-top: 20px;">
                    <h3 style="font-size: 20px; margin-bottom: 10px;">Total: Rs. <span id="totalPrice">0</span>.00</h3>
                    <p style="font-size: 12px; color: #666; margin-bottom: 20px;">Taxes and shipping calculated at checkout</p>
                    <button onclick="app.checkout()" style="background:var(--wa-green); color:white; width:100%; max-width: 400px; padding:18px; border:none; border-radius:5px; cursor:pointer; font-weight: bold; letter-spacing: 1px;">ORDER ON WHATSAPP</button>
                </div>
            </div>
        </section>
    </main>

    <script>
        const app = {
            products: [
                { id: 1, category: "Gadgets", name: "4 In 1 EMERGENCY LIGHT", price: 200, img: "https://m.media-amazon.com/images/I/511FKiYjv3L._SX342_SY445_QL70_FMwebp_.jpg", desc: "Our 4-in-1 Emergency Light is designed for high-intensity illumination." },
                { id: 2, category: "Gadgets", name: "BUDDHA TRIMMER", price: 250, img: "https://m.media-amazon.com/images/I/51aY9Kw1Y6L._SY300_SX300_QL70_FMwebp_.jpg", desc: "Professional T-Blade Trimmer with a unique Buddha design." },
                { id: 3, category: "Beauty", name: "4 In 1 FACIAL KIT", price: 250, img: "https://m.media-amazon.com/images/I/71xiDo3LSbL._SX679_.jpg", desc: "Complete 4-step facial solution for glowing skin." },
                { id: 4, category: "Home", name: "PORTABLE VACCUM SEALER", price: 250, img: "https://m.media-amazon.com/images/I/71fD76VAK-L._SX569_.jpg", desc: "Keep your food fresh for 5x longer!" },
                { id: 5, category: "Home", name: "ELECTRIC PLASMA LIGHTER", price: 250, img: "https://m.media-amazon.com/images/I/612+zfJYAPL._SX569_.jpg", desc: "Windproof and flameless electric lighter." },
                { id: 6, category: "Gadgets", name: "PORTABLE ELECTRONIC JUICER", price: 250, img: "https://m.media-amazon.com/images/I/715bLTUaxAL._AC_UY218_.jpg", desc: "Fresh juice anywhere! USB rechargeable." }
            ],
            cart: [],
            currentFilter: 'All',

            init() {
                const saved = localStorage.getItem('14stars_data');
                if (saved) this.cart = JSON.parse(saved);
                this.updateBadge();
                this.render();
            },

            showSearch() { document.getElementById('searchOverlay').style.display = 'block'; },
            hideSearch() { document.getElementById('searchOverlay').style.display = 'none'; },

            performSearch(query) {
                if (!query) return;
                this.hideSearch();
                const filtered = this.products.filter(p => 
                    p.name.toLowerCase().includes(query.toLowerCase()) || 
                    p.category.toLowerCase().includes(query.toLowerCase())
                );
                this.renderGrid(filtered, 'searchGrid');
                this.nav('search');
                document.getElementById('navSearch').blur();
            },

            nav(id) {
                document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
                document.getElementById('page-' + id).classList.add('active');
                if(id === 'cart') this.renderCart();
                window.scrollTo(0,0);
            },

            openProduct(id) {
                const p = this.products.find(x => x.id === id);
                const detailBox = document.getElementById('productDetailContent');
                detailBox.innerHTML = `
                    <div class="detail-img-box"><img src="${p.img}"></div>
                    <div class="detail-info">
                        <button class="buy-now-btn" style="width:auto; padding:5px 15px; margin-bottom:15px" onclick="app.nav('home')">← Back</button>
                        <h1>${p.name}</h1>
                        <div class="price-tag">Rs. ${p.price}.00</div>
                        <p class="desc">${p.desc}</p>
                        <button class="buy-now-btn" onclick="app.updateQty(${p.id}, 1); app.nav('cart');">Buy it now</button>
                        <div style="margin-top: 20px; color: #444; font-size: 14px;">
                            <p>✅ Premium Quality Product</p>
                            <p>✅ Best for everyday use</p>
                            <p>✅ Fast delivery in Muzaffarnagar</p>
                        </div>
                    </div>
                `;
                this.nav('product-detail');
            },

            filter(cat, btn) {
                this.currentFilter = cat;
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                this.render();
            },

            render() {
                const items = this.currentFilter === 'All' ? this.products : this.products.filter(p => p.category === this.currentFilter);
                this.renderGrid(items, 'homeGrid');
                this.renderGrid(this.products, 'catalogGrid');
            },

            renderGrid(items, targetId) {
                const target = document.getElementById(targetId);
                if (items.length === 0) {
                    target.innerHTML = "<p style='grid-column: 1/-1; text-align:center; padding:40px;'>No products found.</p>";
                    return;
                }
                target.innerHTML = items.map(p => {
                    const inCart = this.cart.find(c => c.id === p.id);
                    const qty = inCart ? inCart.q : 0;
                    return `
                        <div class="product-card">
                            <div class="img-container" onclick="app.openProduct(${p.id})"><img src="${p.img}"></div>
                            <div class="p-name" onclick="app.openProduct(${p.id})" style="cursor:pointer">${p.name}</div>
                            <div class="p-price">Rs. ${p.price}.00</div>
                            <div class="qty-box">
                                <button onclick="app.updateQty(${p.id}, -1)">-</button>
                                <input type="number" value="${qty}" readonly>
                                <button onclick="app.updateQty(${p.id}, 1)">+</button>
                            </div>
                        </div>`;
                }).join('');
            },

            updateQty(id, delta) {
                const p = this.products.find(x => x.id === id);
                const idx = this.cart.findIndex(c => c.id === id);
                if (idx > -1) {
                    this.cart[idx].q += delta;
                    if (this.cart[idx].q <= 0) this.cart.splice(idx, 1);
                } else if (delta > 0) {
                    this.cart.push({...p, q: 1});
                }
                localStorage.setItem('14stars_data', JSON.stringify(this.cart));
                this.updateBadge();
                this.render();
                if(document.getElementById('page-cart').classList.contains('active')) this.renderCart();
            },

            removeFromCart(id) {
                this.cart = this.cart.filter(c => c.id !== id);
                localStorage.setItem('14stars_data', JSON.stringify(this.cart));
                this.updateBadge();
                this.render();
                this.renderCart();
            },

            updateBadge() {
                document.getElementById('badge').innerText = this.cart.reduce((s, i) => s + i.q, 0);
            },

            renderCart() {
                const list = document.getElementById('cartItemsList');
                if (this.cart.length === 0) {
                    list.innerHTML = "<p style='text-align:center; padding:50px 0;'>Your cart is currently empty.</p>";
                    document.getElementById('totalPrice').innerText = 0;
                    document.getElementById('cartSummary').style.display = 'none';
                    return;
                }
                document.getElementById('cartSummary').style.display = 'block';
                let total = 0;
                list.innerHTML = this.cart.map(item => {
                    total += (item.price * item.q);
                    return `
                    <div class="cart-item">
                        <div class="cart-product-cell">
                            <img src="${item.img}" alt="${item.name}">
                            <div class="cart-item-info">
                                <b>${item.name}</b>
                                <span>Rs. ${item.price}.00</span>
                            </div>
                        </div>
                        <div class="quantity-cell">
                            <div class="qty-box">
                                <button onclick="app.updateQty(${item.id}, -1)">-</button>
                                <input type="number" value="${item.q}" readonly>
                                <button onclick="app.updateQty(${item.id}, 1)">+</button>
                            </div>
                            <button class="delete-btn" onclick="app.removeFromCart(${item.id})">🗑️</button>
                        </div>
                        <div class="total-cell">Rs. ${item.price * item.q}.00</div>
                    </div>`;
                }).join('');
                document.getElementById('totalPrice').innerText = total;
            },

            checkout() {
                if (this.cart.length === 0) return alert("Your cart is empty!");
                let msg = "*NEW ORDER - 14 STARS*\n\n";
                this.cart.forEach(i => msg += `▪️ ${i.name} (x${i.q}) - Rs.${i.price * i.q}\n`);
                msg += `\n*Total: Rs. ${document.getElementById('totalPrice').innerText}*`;
                window.open(`https://wa.me/919837904369?text=${encodeURIComponent(msg)}`);
            }
        };
        app.init();
    </script>
</body>
</html>
