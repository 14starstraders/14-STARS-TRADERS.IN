<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="14 STARS TRADERS - Best gadgets, beauty, and home products in Muzaffarnagar.">
    <title>14 STARS TRADERS | Official Store</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #d4af37; --dark: #1a1a1a; --light-bg: #f8f9fa; --wa-green: #25d366; --beige: #bcaaa4; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: #ffffff; color: #333; line-height: 1.5; overflow-x: hidden; }

        header { background: var(--dark); color: #fff; padding: 15px 0; position: sticky; top: 0; z-index: 1000; }
        .nav-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
        .logo { font-size: 20px; font-weight: 700; color: #fff; border: none; background: none; cursor: pointer; white-space: nowrap; }
        .header-search { flex-grow: 1; max-width: 500px; position: relative; z-index: 1001; }
        .header-search input { width: 100%; padding: 10px 40px 10px 20px; border-radius: 25px; border: none; outline: none; font-size: 14px; background: rgba(255,255,255,0.1); color: white; transition: 0.3s; }
        .header-search input:focus { background: white; color: #000; }
        .header-search .search-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #888; cursor: pointer; background: none; border: none; z-index: 10; }
        .header-actions { display: flex; align-items: center; gap: 20px; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: #fff; text-decoration: none; font-size: 13px; cursor: pointer; opacity: 0.8; }
        .nav-links a:hover { opacity: 1; }
        .cart-btn { position: relative; cursor: pointer; background: none; border: none; color: white; font-size: 22px; min-width: 44px; min-height: 44px; }
        .badge { position: absolute; top: 0; right: 0; background: var(--gold); color: #000; font-size: 10px; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        /* FIX: YAHAN PROBLEM THI - Maine color aur image dono set kar diye hain */
        .hero-banner { 
            width: 100%; 
            height: 550px; 
            background-color: #2c3e50;
            background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://copilot.microsoft.com/th/id/BCO.14b9bf03-b01a-4032-8154-f04137d69ac3.png'); 
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: white; 
            text-align: center;
            margin-bottom: 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .filter-section { display: flex; gap: 10px; overflow-x: auto; padding: 25px 0; justify-content: center; scrollbar-width: none; }
        .filter-btn { padding: 8px 20px; border: 1px solid #eee; border-radius: 20px; background: #fff; cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.3s; min-height: 40px; }
        .filter-btn.active { background: var(--dark); color: white; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; padding: 20px 0; }
        .product-card { background: #fff; border: 1px solid #f0f0f0; border-radius: 12px; padding: 12px; transition: 0.3s; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .img-container { background: var(--light-bg); height: 200px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: zoom-in; }
        .img-container img { max-width: 80%; max-height: 90%; object-fit: contain; }
        .p-name { font-size: 14px; font-weight: 600; margin: 10px 0; height: 40px; overflow: hidden; }
        .p-price { font-size: 16px; font-weight: 700; color: #000; margin-bottom: 10px; }
        .qty-box { display: flex; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; width: 100%; }
        .qty-box button { flex: 1; height: 35px; border: none; background: #fff; cursor: pointer; font-size: 18px; min-width: 44px; }
        .qty-box input { width: 50px; text-align: center; border: none; outline: none; font-weight: bold; }
        .page-view { display: none; }
        .active { display: block; }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .hero-banner { height: 300px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <button class="logo" onclick="app.nav('home')">14 STARS TRADERS</button>
            <div class="header-search">
                <input type="text" id="navSearch" placeholder="Search products..." onfocus="app.showSearch()">
                <button class="search-icon">🔍</button>
            </div>
            <div class="header-actions">
                <nav class="nav-links">
                    <a onclick="app.nav('home')">Home</a>
                    <a onclick="app.nav('catalog')">Catalog</a>
                    <a onclick="app.openContact()">Contact</a>
                </nav>
                <button class="cart-btn" onclick="app.nav('cart')">
                    👜 <span class="badge" id="badge">0</span>
                </button>
            </div>
        </div>
    </header>

    <main>
        <section id="page-home" class="page-view active">
            <div class="hero-banner">
                <div style="padding: 20px;">
                    <h1 style="font-size: 3rem; margin-bottom: 10px;"></h1>
                    <p style="font-size: 1.2rem;"></p>
                </div>
            </div>
            <div class="container">
                <div class="filter-section">
                    <button class="filter-btn active" onclick="app.filter('All', this)">All Items</button>
                    <button class="filter-btn" onclick="app.filter('Gadgets', this)">Gadgets</button>
                    <button class="filter-btn" onclick="app.filter('Beauty', this)">Beauty</button>
                    <button class="filter-btn" onclick="app.filter('Home', this)">Home</button>
                </div>
                <div id="homeGrid" class="grid"></div>
            </div>
        </section>

        <section id="page-catalog" class="page-view">
            <div class="container"><h2 style="margin:40px 0; text-align:center;">PRODUCT CATALOG</h2><div id="catalogGrid" class="grid"></div></div>
        </section>

        <section id="page-cart" class="page-view">
            <div class="container" style="max-width: 900px; padding: 50px 20px;">
                <h1>Your cart</h1>
                <div id="cartItemsList"></div>
            </div>
        </section>
    </main>

    <script>
        const app = {
            products: [
                { id: 1, category: "Gadgets", name: "4 In 1 EMERGENCY LIGHT", price: 200, img: "https://m.media-amazon.com/images/I/511FKiYjv3L._SX342_SY445_QL70_FMwebp_.jpg" },
                { id: 2, category: "Gadgets", name: "BUDDHA TRIMMER", price: 250, img: "https://m.media-amazon.com/images/I/51aY9Kw1Y6L._SY300_SX300_QL70_FMwebp_.jpg" },
                { id: 3, category: "Beauty", name: "4 In 1 FACIAL KIT", price: 250, img: "https://m.media-amazon.com/images/I/71xiDo3LSbL._SX679_.jpg" },
                { id: 4, category: "Home", name: "PORTABLE VACCUM SEALER", price: 250, img: "https://m.media-amazon.com/images/I/71fD76VAK-L._SX569_.jpg" },
                { id: 5, category: "Home", name: "ELECTRIC PLASMA LIGHTER", price: 250, img: "https://m.media-amazon.com/images/I/612+zfJYAPL._SX569_.jpg" },
                { id: 6, category: "Gadgets", name: "PORTABLE ELECTRONIC JUICER", price: 250, img: "https://m.media-amazon.com/images/I/715bLTUaxAL._AC_UY218_.jpg" }
            ],
            cart: [],
            currentFilter: 'All',

            init() { this.render(); },
            nav(id) {
                document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
                document.getElementById('page-' + id).classList.add('active');
            },
            filter(cat, btn) {
                this.currentFilter = cat;
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                this.render();
            },
            render() {
                const items = this.currentFilter === 'All' ? this.products : this.products.filter(p => p.category === this.currentFilter);
                const target = document.getElementById('homeGrid');
                target.innerHTML = items.map(p => `
                    <div class="product-card">
                        <div class="img-container"><img src="${p.img}" alt="${p.name}"></div>
                        <div class="p-name">${p.name}</div>
                        <div class="p-price">Rs. ${p.price}.00</div>
                        <div class="qty-box">
                            <button onclick="alert('Added to cart')">+</button>
                        </div>
                    </div>`).join('');
            }
        };
        app.init();
    </script>
</body>
</html>
