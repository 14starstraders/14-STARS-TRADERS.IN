<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="14 STARS TRADERS - Best gadgets, beauty, and home products in Muzaffarnagar.">
    <title>14 STARS TRADERS | Official Store</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #d4af37; --dark: #1a1a1a; --light-bg: #f8f9fa; --wa-green: #25d366; --beige: #bcaaa4; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: #ffffff; color: #333; line-height: 1.5; overflow-x: hidden; }

        /* HEADER & SEARCH IN NAV */
        header { background: var(--dark); color: #fff; padding: 15px 0; position: sticky; top: 0; z-index: 1000; }
        .nav-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
        
        .logo { font-size: 20px; font-weight: 700; color: #fff; border: none; background: none; cursor: pointer; white-space: nowrap; }
        
        .header-search { flex-grow: 1; max-width: 500px; position: relative; z-index: 1001; }
        .header-search input { width: 100%; padding: 10px 40px 10px 20px; border-radius: 25px; border: none; outline: none; font-size: 14px; background: rgba(255,255,255,0.1); color: white; transition: 0.3s; }
        .header-search input:focus { background: white; color: #000; }
        
        .header-search .search-icon { 
            position: absolute; 
            right: 15px; 
            top: 50%; 
            transform: translateY(-50%); 
            color: #888; 
            cursor: pointer; 
            background: none;
            border: none;
            z-index: 10;
        }

        .header-actions { display: flex; align-items: center; gap: 20px; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: #fff; text-decoration: none; font-size: 13px; cursor: pointer; opacity: 0.8; }
        .nav-links a:hover { opacity: 1; }

        .cart-btn { position: relative; cursor: pointer; background: none; border: none; color: white; font-size: 22px; min-width: 44px; min-height: 44px; }
        .badge { position: absolute; top: 0; right: 0; background: var(--gold); color: #fff; font-size: 10px; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        #searchOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); z-index: 999; }

        /* SEARCH PAGE STYLES */
        .search-results-page { text-align: center; padding: 80px 20px; color: #555; }
        .search-results-page h1 { font-weight: 400; font-size: 32px; margin-bottom: 40px; color: #333; }
        
        .search-bar-container { 
            max-width: 800px; 
            margin: 0 auto 30px; 
            position: relative; 
            border: 1px solid #e0e0e0; 
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 8px 15px;
            background: #fff;
        }
        .search-bar-container label {
            position: absolute;
            top: 8px;
            left: 15px;
            font-size: 10px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .search-bar-container input { 
            width: 100%; 
            border: none; 
            outline: none; 
            padding: 22px 10px 5px 0; 
            font-size: 18px;
            background: transparent;
            color: #333;
            text-transform: uppercase;
        }
        .search-bar-controls { display: flex; gap: 15px; align-items: center; border-left: 1px solid #eee; padding-left: 15px; }
        .clear-search { cursor: pointer; font-size: 18px; color: #bbb; background: none; border: none; transition: 0.2s; }
        .clear-search:hover { color: #333; }
        .search-submit { cursor: pointer; font-size: 20px; background: none; border: none; color: #333; }
        
        .no-results-text { font-size: 16px; color: #666; margin-top: 30px; font-weight: 400; }

        /* HERO & GRID STYLES */
        .hero-banner { width: 100%; height: 500px; background: linear-gradient(rgba(0,0,0,0.4),rgba(0,0,0,0.4)), url('https://copilot.microsoft.com/th/id/BCO.c36814e0-4b79-4fd5-9e55-1000825f2caa.png') center/cover no-repeat; display: flex; align-items: center; justify-content: center; color: white; text-align: center; }
        .filter-section { display: flex; gap: 10px; overflow-x: auto; padding: 25px 0; justify-content: center; scrollbar-width: none; }
        .filter-btn { padding: 8px 20px; border: 1px solid #eee; border-radius: 20px; background: #fff; cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.3s; min-height: 40px; }
        .filter-btn.active { background: var(--dark); color: white; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; padding: 20px 0; }
        .product-card { background: #fff; border: 1px solid #f0f0f0; border-radius: 12px; padding: 12px; transition: 0.3s; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .img-container { background: var(--light-bg); height: 200px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: zoom-in; }
        .img-container img { max-width: 80%; max-height: 90%; object-fit: contain; }
        .p-name { font-size: 14px; font-weight: 600; margin: 10px 0; height: 40px; overflow: hidden; }
        .p-price { font-size: 16px; font-weight: 700; color: #000; margin-bottom: 10px; }
        
        .qty-box { display: flex; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; width: 100%; }
        .qty-box button { flex: 1; height: 35px; border: none; background: #fff; cursor: pointer; font-size: 18px; min-width: 40px; }
        .qty-box input { width: 50px; text-align: center; border: none; outline: none; font-weight: bold; }

        /* CART PAGE TABLE STYLES */
        .cart-table { width: 100%; border-collapse: collapse; margin-top: 30px; }
        .cart-table th { text-align: left; font-size: 12px; color: #999; text-transform: uppercase; letter-spacing: 1px; padding-bottom: 15px; border-bottom: 1px solid #eee; font-weight: 400; }
        .cart-table td { padding: 20px 0; border-bottom: 1px solid #eee; vertical-align: middle; }
        
        .cart-product-cell { display: flex; gap: 15px; align-items: center; }
        .cart-product-cell img { width: 70px; height: 70px; object-fit: contain; background: #f9f9f9; border-radius: 5px; }
        .cart-product-info b { font-size: 15px; display: block; margin-bottom: 3px; }
        .cart-product-info small { color: #777; font-size: 13px; }

        .qty-ctrl { display: flex; align-items: center; border: 1px solid #ddd; border-radius: 4px; width: fit-content; margin: 0 auto; }
        .qty-ctrl button { background: none; border: none; padding: 5px 12px; cursor: pointer; font-size: 18px; }
        .qty-ctrl span { width: 30px; text-align: center; font-weight: 600; font-size: 14px; }
        
        .remove-btn { background: none; border: none; color: #bbb; cursor: pointer; margin-left: 15px; font-size: 18px; transition: 0.2s; }
        .remove-btn:hover { color: #ff4444; }

        /* DETAILS & CONTACT */
        .product-detail-container { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; padding: 40px 0; align-items: start; }
        .detail-img-box { background: var(--light-bg); border-radius: 15px; padding: 20px; display: flex; justify-content: center; }
        .detail-img-box img { max-width: 100%; border-radius: 10px; height: auto; }
        .detail-info h1 { font-size: 32px; margin-bottom: 10px; }
        .price-tag { font-size: 24px; font-weight: bold; margin-bottom: 20px; }
        .buy-now-btn { background: var(--beige); color: white; border: none; padding: 15px 40px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 200px; }

        #contactPopup { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); backdrop-filter: blur(5px); }
        .modal-content { background-color: #fff; margin: 5% auto; padding: 40px; border-radius: 15px; width: 90%; max-width: 550px; position: relative; text-align: center; box-shadow: 0 5px 30px rgba(0,0,0,0.3); }
        .close-popup { position: absolute; right: 20px; top: 15px; font-size: 28px; cursor: pointer; color: #999; }
        .send-btn { background: var(--beige); color: white; border: none; padding: 15px 50px; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 20px; width: 100%; font-weight: 600; }

        .page-view { display: none; }
        .active { display: block; }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .cart-table th:nth-child(2), .cart-table td:nth-child(2) { text-align: right; }
            .cart-product-info b { font-size: 13px; }
            .cart-product-cell img { width: 50px; height: 50px; }
        }
    </style>
</head>
<body>

    <div id="searchOverlay" onclick="app.hideSearch()"></div>

    <div id="contactPopup">
        <div class="modal-content">
            <span class="close-popup" onclick="app.closeContact()">&times;</span>
            <div class="contact-form-container">
                <h2>Questions or comments?</h2>
                <p>Get in touch and we'll be happy to help.</p>
                <div style="display: flex; gap: 15px; margin-bottom: 15px;">
                    <input type="text" id="cName" placeholder="Name" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                    <input type="email" id="cEmail" placeholder="Email *" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                </div>
                <input type="text" id="cPhone" placeholder="Phone number" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom:15px;">
                <textarea id="cMsg" placeholder="Comment" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; height: 100px; resize: none;"></textarea>
                <button class="send-btn" onclick="app.sendContact()">Send</button>
            </div>
        </div>
    </div>

    <header>
        <div class="nav-container">
            <button class="logo" onclick="app.nav('home')">14 STARS TRADERS</button>
            <div class="header-search">
                <input type="text" id="navSearch" placeholder="Search products..." onfocus="app.showSearch()" onkeyup="if(event.key === 'Enter') app.performSearch(this.value)">
                <button class="search-icon" onclick="app.performSearch(document.getElementById('navSearch').value)">🔍</button>
            </div>
            <div class="header-actions">
                <nav class="nav-links">
                    <a onclick="app.nav('home')">Home</a>
                    <a onclick="app.nav('catalog')">Catalog</a>
                    <a onclick="app.openContact()">Contact</a>
                </nav>
                <button class="cart-btn" onclick="app.nav('cart')">
                    👜 <span class="badge" id="badge">0</span>
                </button>
            </div>
        </div>
    </header>

    <main>
        <section id="page-home" class="page-view active">
            <div class="hero-banner"></div>
            <div class="container">
                <div class="filter-section">
                    <button class="filter-btn active" onclick="app.filter('All', this)">All Items</button>
                    <button class="filter-btn" onclick="app.filter('Gadgets', this)">Gadgets</button>
                    <button class="filter-btn" onclick="app.filter('Beauty', this)">Beauty</button>
                    <button class="filter-btn" onclick="app.filter('Home', this)">Home</button>
                </div>
                <div id="homeGrid" class="grid"></div>
            </div>
        </section>

        <section id="page-search" class="page-view">
            <div class="search-results-page">
                <div class="container">
                    <h1>Search results</h1>
                    <div class="search-bar-container">
                        <label>Search</label>
                        <input type="text" id="mainSearchInput" onkeyup="if(event.key === 'Enter') app.performSearch(this.value)">
                        <div class="search-bar-controls">
                            <button class="clear-search" onclick="app.clearSearch()">✕</button>
                            <button class="search-submit" onclick="app.performSearch(document.getElementById('mainSearchInput').value)">🔍</button>
                        </div>
                    </div>
                    <div id="searchMessage"></div>
                    <div id="searchGrid" class="grid"></div>
                </div>
            </div>
        </section>

        <section id="page-product-detail" class="page-view">
            <div class="container"><div id="productDetailContent" class="product-detail-container"></div></div>
        </section>

        <section id="page-catalog" class="page-view">
            <div class="container"><h2 style="margin:40px 0; text-align:center;">PRODUCT CATALOG</h2><div id="catalogGrid" class="grid"></div></div>
        </section>

        <section id="page-cart" class="page-view">
            <div class="container" style="max-width: 900px; padding: 50px 20px;">
                <h1 style="font-size: 36px; font-weight: 500; margin-bottom:30px">Your cart</h1>
                <div id="cartItemsList"></div>
                <div id="cartSummary" style="text-align:right; margin-top:40px; border-top: 1px solid #eee; padding-top: 20px;">
                    <p style="color:#666; margin-bottom:10px;">Estimated total</p>
                    <h3 style="font-size:24px;">Rs. <span id="totalPrice">0</span>.00</h3>
                    <p style="font-size:12px; color:#999; margin: 10px 0 20px;">Taxes and shipping calculated at checkout</p>
                    <button onclick="app.checkout()" style="background:var(--wa-green); color:white; width:100%; max-width:400px; padding:18px; border:none; border-radius:5px; cursor:pointer; font-weight:bold; letter-spacing:1px;">ORDER ON WHATSAPP</button>
                </div>
            </div>
        </section>
    </main>

    <script>
        const app = {
            products: [
                { id: 1, category: "Gadgets", name: "4 In 1 EMERGENCY LIGHT", price: 200, img: "https://m.media-amazon.com/images/I/511FKiYjv3L._SX342_SY445_QL70_FMwebp_.jpg", desc: "Our 4-in-1 Emergency Light is designed for high-intensity illumination." },
                { id: 2, category: "Gadgets", name: "BUDDHA TRIMMER", price: 250, img: "https://m.media-amazon.com/images/I/51aY9Kw1Y6L._SY300_SX300_QL70_FMwebp_.jpg", desc: "Professional T-Blade Trimmer with a unique Buddha design." },
                { id: 3, category: "Beauty", name: "4 In 1 FACIAL KIT", price: 250, img: "https://m.media-amazon.com/images/I/71xiDo3LSbL._SX679_.jpg", desc: "Complete 4-step facial solution for glowing skin." },
                { id: 4, category: "Home", name: "PORTABLE VACCUM SEALER", price: 250, img: "https://m.media-amazon.com/images/I/71fD76VAK-L._SX569_.jpg", desc: "Keep your food fresh for 5x longer!" },
                { id: 5, category: "Home", name: "ELECTRIC PLASMA LIGHTER", price: 250, img: "https://m.media-amazon.com/images/I/612+zfJYAPL._SX569_.jpg", desc: "Windproof and flameless electric lighter." },
                { id: 6, category: "Gadgets", name: "PORTABLE ELECTRONIC JUICER", price: 250, img: "https://m.media-amazon.com/images/I/715bLTUaxAL._AC_UY218_.jpg", desc: "Fresh juice anywhere! USB rechargeable." }
            ],
            cart: [],
            currentFilter: 'All',

            init() {
                const saved = localStorage.getItem('14stars_data');
                if (saved) this.cart = JSON.parse(saved);
                this.updateBadge();
                this.render();
            },

            showSearch() { document.getElementById('searchOverlay').style.display = 'block'; },
            hideSearch() { document.getElementById('searchOverlay').style.display = 'none'; },

            openContact() { document.getElementById('contactPopup').style.display = 'block'; document.body.style.overflow = 'hidden'; },
            closeContact() { document.getElementById('contactPopup').style.display = 'none'; document.body.style.overflow = 'auto'; },
            sendContact() {
                const name = document.getElementById('cName').value;
                const msg = document.getElementById('cMsg').value;
                if(!name || !msg) return alert("Please fill Name and Message");
                window.open(`https://wa.me/919837904369?text=Hi, I am ${name}. ${msg}`);
                this.closeContact();
            },

            clearSearch() {
                document.getElementById('mainSearchInput').value = '';
                document.getElementById('searchGrid').innerHTML = '';
                document.getElementById('searchMessage').innerHTML = '';
            },

            performSearch(query) {
                if (!query) return;
                this.hideSearch();
                const q = query.trim().toUpperCase();
                const filtered = this.products.filter(p => p.name.toUpperCase().includes(q) || p.category.toUpperCase().includes(q));
                document.getElementById('mainSearchInput').value = q;
                const msgBox = document.getElementById('searchMessage');
                if (filtered.length === 0) msgBox.innerHTML = `<p class="no-results-text">No results found for “${q}”.</p>`;
                else msgBox.innerHTML = "";
                this.renderGrid(filtered, 'searchGrid');
                this.nav('search');
            },

            nav(id) {
                document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
                document.getElementById('page-' + id).classList.add('active');
                if(id === 'cart') this.renderCart();
                window.scrollTo(0,0);
            },

            openProduct(id) {
                const p = this.products.find(x => x.id === id);
                document.getElementById('productDetailContent').innerHTML = `
                    <div class="detail-img-box"><img src="${p.img}" alt="${p.name}"></div>
                    <div class="detail-info">
                        <button class="buy-now-btn" style="width:auto; padding:5px 15px; margin-bottom:15px; background:#666" onclick="app.nav('home')">← Back</button>
                        <h1>${p.name}</h1>
                        <div class="price-tag">Rs. ${p.price}.00</div>
                        <p style="margin-bottom:30px">${p.desc}</p>
                        <button class="buy-now-btn" onclick="app.updateQty(${p.id}, 1); app.nav('cart');">ADD TO CART</button>
                    </div>`;
                this.nav('product-detail');
            },

            filter(cat, btn) {
                this.currentFilter = cat;
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                this.render();
            },

            render() {
                const items = this.currentFilter === 'All' ? this.products : this.products.filter(p => p.category === this.currentFilter);
                this.renderGrid(items, 'homeGrid');
                this.renderGrid(this.products, 'catalogGrid');
            },

            renderGrid(items, targetId) {
                const target = document.getElementById(targetId);
                target.innerHTML = items.map(p => {
                    const inCart = this.cart.find(c => c.id === p.id);
                    const qty = inCart ? inCart.q : 0;
                    return `
                        <div class="product-card">
                            <div class="img-container" onclick="app.openProduct(${p.id})"><img src="${p.img}" alt="${p.name}"></div>
                            <div class="p-name" onclick="app.openProduct(${p.id})" style="cursor:pointer">${p.name}</div>
                            <div class="p-price">Rs. ${p.price}.00</div>
                            <div class="qty-box">
                                <button onclick="app.updateQty(${p.id}, -1)">-</button>
                                <input type="number" value="${qty}" readonly>
                                <button onclick="app.updateQty(${p.id}, 1)">+</button>
                            </div>
                        </div>`;
                }).join('');
            },

            updateQty(id, delta) {
                const idx = this.cart.findIndex(c => c.id === id);
                if (idx > -1) {
                    this.cart[idx].q += delta;
                    if (this.cart[idx].q <= 0) this.cart.splice(idx, 1);
                } else if (delta > 0) {
                    const p = this.products.find(x => x.id === id);
                    this.cart.push({...p, q: 1});
                }
                localStorage.setItem('14stars_data', JSON.stringify(this.cart));
                this.updateBadge();
                this.render();
                if(document.getElementById('page-cart').classList.contains('active')) this.renderCart();
            },

            updateBadge() { document.getElementById('badge').innerText = this.cart.reduce((s, i) => s + i.q, 0); },

            renderCart() {
                const list = document.getElementById('cartItemsList');
                const summary = document.getElementById('cartSummary');
                if (this.cart.length === 0) {
                    list.innerHTML = "<p style='text-align:center; padding:50px 0; color:#666;'>Your cart is currently empty.</p>";
                    summary.style.display = 'none';
                    return;
                }
                summary.style.display = 'block';
                let total = 0;
                let tableHtml = `
                    <table class="cart-table">
                        <thead>
                            <tr>
                                <th>PRODUCT</th>
                                <th style="text-align:center">QUANTITY</th>
                                <th style="text-align:right">TOTAL</th>
                            </tr>
                        </thead>
                        <tbody>`;
                
                this.cart.forEach(item => {
                    total += (item.price * item.q);
                    tableHtml += `
                        <tr>
                            <td>
                                <div class="cart-product-cell">
                                    <img src="${item.img}">
                                    <div class="cart-product-info">
                                        <b>${item.name}</b>
                                        <small>Rs. ${item.price}.00</small>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <div style="display:flex; align-items:center; justify-content:center;">
                                    <div class="qty-ctrl">
                                        <button onclick="app.updateQty(${item.id}, -1)">-</button>
                                        <span>${item.q}</span>
                                        <button onclick="app.updateQty(${item.id}, 1)">+</button>
                                    </div>
                                    <button class="remove-btn" onclick="app.updateQty(${item.id}, -${item.q})">🗑</button>
                                </div>
                            </td>
                            <td style="text-align:right; font-weight:500;">Rs. ${item.price * item.q}.00</td>
                        </tr>`;
                });
                
                tableHtml += `</tbody></table>`;
                list.innerHTML = tableHtml;
                document.getElementById('totalPrice').innerText = total;
            },

            checkout() {
                let msg = "*NEW ORDER - 14 STARS*\n\n";
                this.cart.forEach(i => msg += `▪️ ${i.name} (x${i.q})\n`);
                msg += `\n*Total: Rs. ${document.getElementById('totalPrice').innerText}*`;
                window.open(`https://wa.me/919837904369?text=${encodeURIComponent(msg)}`);
            }
        };
        app.init();
        window.onclick = function(event) { if (event.target == document.getElementById('contactPopup')) app.closeContact(); }
    </script>
</body>
</html>
